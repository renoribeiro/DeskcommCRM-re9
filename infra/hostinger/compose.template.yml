# MOLDE do docker-compose.hostinger.yml — NÃO é o arquivo que se cola no painel.
#
# O arquivo final é GERADO a partir deste molde por
#   pnpm compose:hostinger
# O gerador troca a linha `#@crm-env` pelas variáveis do CRM tiradas do bloco
# `x-crm-env` do docker-compose.dokploy.yml (com DEPLOY_MODE=hostinger e os
# endereços internos pelos nomes dos serviços) e deixa o arquivo 100% ASCII.
# O gate tests/shell/hostinger-compose.test.sh reprova arquivo fora de dia.
#
# POR QUE O ARQUIVO É ASSIM (medido no editor do Docker Manager da Hostinger):
#   o editor recusou ("O arquivo YAML não pôde ser processado", linha 1) a versão
#   com acento, e depois a versão sem acento que tinha blocos `x-` no topo,
#   `<<:` e `configs` com os arquivos embutidos (117 KB). Este molde usa só o que
#   o YAML do Typebot que o painel aceita já usa: `services` e `volumes` no
#   topo, âncora `&`/`*` DENTRO de serviço, `entrypoint` com `- |`, labels em
#   lista e `depends_on` com `condition`.
#
# ImobCRM / DeskcommCRM no DOCKER MANAGER DA HOSTINGER — tudo numa VPS:
# Supabase + CRM, atrás do Traefik que a Hostinger instala.
#
# Como usar: docs/imobiliario/05-instalacao-hostinger-docker-manager.md
#   1. No terminal da VPS, gere as variáveis com o gerar-env.sh da mesma versão.
#   2. Docker Manager: cole ESTE ARQUIVO no editor .yaml e as variáveis geradas.
#
# Os arquivos do Supabase (init do banco e gateway) e o script de preparo NÃO
# vêm dentro deste arquivo: o serviço `arquivos` os baixa da tag v<IMAGE_TAG>
# do repositório a cada implantação (como o setup já baixa o schema do banco),
# e db, api-gw e setup os leem do volume `arquivos`.
#
# Traefik da Hostinger: roda em network_mode host e alcança os contêineres
# pela rede <projeto>_default. Nenhuma porta é publicada no host — publicar
# contornaria o Traefik e o bloqueio do webhook do WhatsApp que mora nele.
# Cada projeto tem a rede dele, então os serviços se acham pelo próprio nome.

services:
  # ═══════════════════════ ARQUIVOS DA VERSÃO (roda e sai) ═══════════════════
  arquivos:
    image: postgres:17.6-alpine3.22
    restart: "no"
    mem_limit: 64m
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        base="https://raw.githubusercontent.com/renoribeiro/DeskcommCRM-re9/v$${IMAGE_TAG}"
        baixa() {
          destino="/arquivos/$$2"
          mkdir -p "$$(dirname "$$destino")"
          if ! wget -q -T 60 -O "$$destino.tmp" "$$base/$$1" || [ ! -s "$$destino.tmp" ]; then
            echo "[arquivos] NAO consegui baixar $$1 da versao $${IMAGE_TAG} ($$base). Confira se a tag v$${IMAGE_TAG} existe e se a VPS alcanca raw.githubusercontent.com." >&2
            exit 1
          fi
          mv "$$destino.tmp" "$$destino"
        }
        baixa infra/dokploy/supabase/db/realtime.sql db/migrations/99-realtime.sql
        baixa infra/dokploy/supabase/db/webhooks.sql db/init-scripts/98-webhooks.sql
        baixa infra/dokploy/supabase/db/roles.sql db/init-scripts/99-roles.sql
        baixa infra/dokploy/supabase/db/jwt.sql db/init-scripts/99-jwt.sql
        baixa infra/dokploy/supabase/db/_supabase.sql db/migrations/97-_supabase.sql
        baixa infra/dokploy/supabase/db/logs.sql db/migrations/99-logs.sql
        baixa infra/dokploy/supabase/db/pooler.sql db/migrations/99-pooler.sql
        baixa infra/dokploy/supabase/api/envoy/envoy.yaml envoy/envoy.yaml
        baixa infra/dokploy/supabase/api/envoy/cds.yaml envoy/cds.yaml
        baixa infra/dokploy/supabase/api/envoy/lds.template.yaml envoy/lds.template.yaml
        baixa infra/dokploy/supabase/api/envoy/docker-entrypoint.sh envoy/docker-entrypoint.sh
        baixa infra/dokploy/primeira-instalacao.sh setup/primeira-instalacao.sh
        # O cds.yaml oficial chama o Realtime pelo apelido da rede do Supabase
        # (realtime-dev.supabase-realtime); aqui o servico se chama `realtime`.
        sed -i 's/^\([[:space:]]*address:[[:space:]]*\)realtime-dev\.supabase-realtime[[:space:]]*$$/\1realtime/' /arquivos/envoy/cds.yaml
        grep -q 'address: realtime$$' /arquivos/envoy/cds.yaml || { echo "[arquivos] o cds.yaml mudou de formato: nao achei o endereco do Realtime" >&2; exit 1; }
        echo "[arquivos] pronto: arquivos da versao $${IMAGE_TAG}"
    environment:
      IMAGE_TAG: ${IMAGE_TAG:?defina IMAGE_TAG com uma versão publicada, ex. 1.58.1}
    volumes:
      - arquivos:/arquivos
    logging: &log
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ══════════════════════════════ SUPABASE ══════════════════════════════════
  db:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    mem_limit: 1536m
    depends_on:
      arquivos:
        condition: service_completed_successfully
    # Os scripts de init do Supabase entram no lugar e a entrada ORIGINAL da
    # imagem (docker-entrypoint.sh, como root) segue com o `command` abaixo.
    entrypoint:
      - /bin/sh
      - -c
      - |
        cp -R /arquivos/db/. /docker-entrypoint-initdb.d/
        exec docker-entrypoint.sh "$$@"
      - db
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal",
              "-c", "shared_buffers=512MB", "-c", "effective_cache_size=2GB"]
    volumes:
      - arquivos:/arquivos:ro
      - db-data:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET}
      JWT_EXP: 3600
    logging: *log

  auth:
    image: supabase/gotrue:v2.196.0
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: https://${DOMAIN:?defina DOMAIN}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: https://${DOMAIN}
      GOTRUE_URI_ALLOW_LIST: https://${DOMAIN}/auth/confirm,https://${DOMAIN}/**
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_ISSUER: https://${DOMAIN}/auth/v1
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_FROM_EMAIL:-}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USERNAME:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASSWORD:-}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_FROM_NAME:-}
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_SMS_AUTOCONFIRM: "false"
    logging: *log

  rest:
    image: postgrest/postgrest:v14.17
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 3
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,graphql_public
      PGRST_DB_MAX_ROWS: 1000
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: 3600
    command: ["postgrest"]
    logging: *log

  realtime:
    image: supabase/realtime:v2.134.10
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sSfL --head -o /dev/null -H \"Authorization: Bearer ${ANON_KEY:?defina ANON_KEY}\" http://localhost:4000/api/tenants/realtime-dev/health"]
      timeout: 5s
      interval: 30s
      retries: 3
      start_period: 10s
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      # 16 caracteres, gerado pelo gerar-env.sh. Não troque depois de instalar.
      DB_ENC_KEY: ${REALTIME_DB_ENC_KEY:?defina REALTIME_DB_ENC_KEY (16 caracteres, sai do gerar-env.sh)}
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?defina SECRET_KEY_BASE}
      METRICS_JWT_SECRET: ${JWT_SECRET}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      DISABLE_HEALTHCHECK_LOGGING: "true"
    logging: *log

  storage:
    image: supabase/storage-api:v1.74.0
    restart: unless-stopped
    mem_limit: 384m
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
      imgproxy:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://storage:5000/status"]
      timeout: 5s
      interval: 5s
      retries: 3
      start_period: 10s
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY:?defina SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      STORAGE_PUBLIC_URL: https://${DOMAIN}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      GLOBAL_S3_BUCKET: stub
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      ENABLE_IMAGE_TRANSFORMATION: "true"
      IMGPROXY_URL: http://imgproxy:5001
    volumes:
      - storage-data:/var/lib/storage
    logging: *log

  imgproxy:
    image: darthsim/imgproxy:v3.31.4
    restart: unless-stopped
    mem_limit: 512m
    volumes:
      - storage-data:/var/lib/storage
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      IMGPROXY_BIND: ":5001"
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_AUTO_WEBP: "true"
      IMGPROXY_MAX_SRC_RESOLUTION: 16.8
      IMGPROXY_WORKERS: "2"
      IMGPROXY_CONCURRENCY: "2"
    logging: *log

  api-gw:
    image: envoyproxy/envoy:v1.39.1
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      arquivos:
        condition: service_completed_successfully
      auth:
        condition: service_healthy
      rest:
        condition: service_started
      storage:
        condition: service_started
    # A configuração do Supabase entra em /etc/envoy, e a entrada oficial do
    # Supabase gera o lds.yaml das chaves e sobe o Envoy.
    entrypoint:
      - /bin/sh
      - -c
      - |
        cp /arquivos/envoy/envoy.yaml /arquivos/envoy/cds.yaml /arquivos/envoy/lds.template.yaml /etc/envoy/
        exec /bin/sh /arquivos/envoy/docker-entrypoint.sh
    volumes:
      - arquivos:/arquivos:ro
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/8000'"]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_PUBLISHABLE_KEY: ""
      SUPABASE_SECRET_KEY: ""
      ANON_KEY_ASYMMETRIC: ""
      SERVICE_ROLE_KEY_ASYMMETRIC: ""
      SUPABASE_PUBLIC_URL: https://${DOMAIN}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-supabase}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?defina DASHBOARD_PASSWORD}
    labels:
      - traefik.enable=true
      - traefik.docker.network=${COMPOSE_PROJECT_NAME}_default
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-supabase.rule=Host(`${DOMAIN}`) && (PathPrefix(`/auth/v1`) || PathPrefix(`/rest/v1`) || PathPrefix(`/realtime/v1`) || PathPrefix(`/storage/v1`) || PathPrefix(`/functions/v1`) || PathPrefix(`/graphql/v1`))
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-supabase.entrypoints=websecure
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-supabase.tls.certresolver=letsencrypt
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-supabase.priority=900
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-supabase.service=${COMPOSE_PROJECT_NAME}-supabase
      - traefik.http.services.${COMPOSE_PROJECT_NAME}-supabase.loadbalancer.server.port=8000
    logging: *log

  # ════════════════════════════════ CRM ═════════════════════════════════════
  # Roda a cada implantação e sai: schema (baseline.sql da versão) e primeiro administrador.
  setup:
    image: postgres:17.6-alpine3.22
    restart: "no"
    mem_limit: 256m
    depends_on:
      arquivos:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
      rest:
        condition: service_healthy
      storage:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/arquivos/setup/primeira-instalacao.sh"]
    volumes:
      - arquivos:/arquivos:ro
    environment:
      IMAGE_TAG: ${IMAGE_TAG}
      # Sem o repositório ao lado, o schema vem SEMPRE da tag da versão.
      BASELINE_FONTE: versao
      DB_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      AUTH_URL: http://auth:9999
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      OWNER_EMAIL: ${OWNER_EMAIL:?defina OWNER_EMAIL}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
      APP_LOCALE: ${APP_LOCALE:-pt-BR}
      NUVEMSHOP_OAUTH_ENCRYPTION_KEY: ${NUVEMSHOP_OAUTH_ENCRYPTION_KEY:?defina NUVEMSHOP_OAUTH_ENCRYPTION_KEY}
    logging: *log

  app:
    image: ghcr.io/renoribeiro/deskcommcrm:${IMAGE_TAG:?defina IMAGE_TAG com uma versão publicada, ex. 1.58.1}
    pull_policy: missing
    restart: unless-stopped
    mem_limit: 768m
    depends_on:
      setup:
        condition: service_completed_successfully
      srh:
        condition: service_started
      waha:
        condition: service_started
    environment: &crm-env
      #@crm-env
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    labels:
      - traefik.enable=true
      - traefik.docker.network=${COMPOSE_PROJECT_NAME}_default
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=letsencrypt
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.middlewares=${COMPOSE_PROJECT_NAME}-compress
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.service=${COMPOSE_PROJECT_NAME}
      - traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=3000
      - traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-compress.compress=true
      # O webhook GLOBAL do WAHA só é chamado de dentro (o WAHA fala com
      # http://app:3000). Pelo Traefik ele é negado.
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-waha-block.rule=Host(`${DOMAIN}`) && Path(`/api/v1/webhooks/waha`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-waha-block.entrypoints=websecure
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-waha-block.tls.certresolver=letsencrypt
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-waha-block.priority=1000
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-waha-block.service=${COMPOSE_PROJECT_NAME}
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-waha-block.middlewares=${COMPOSE_PROJECT_NAME}-deny
      - traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-deny.ipallowlist.sourcerange=192.0.2.1/32
    logging: *log

  worker:
    image: ghcr.io/renoribeiro/deskcomm-worker:${IMAGE_TAG:?defina IMAGE_TAG com uma versão publicada, ex. 1.58.1}
    pull_policy: missing
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      setup:
        condition: service_completed_successfully
    environment: *crm-env
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *log

  scheduler:
    image: ghcr.io/renoribeiro/deskcomm-scheduler:${IMAGE_TAG:?defina IMAGE_TAG com uma versão publicada, ex. 1.58.1}
    pull_policy: missing
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      app:
        condition: service_healthy
    environment:
      TZ: UTC
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      SCHEDULER_APP_ORIGIN: http://app:3000
    logging: *log

  waha:
    image: devlikeapro/waha:latest-2026.7.2
    restart: unless-stopped
    mem_limit: 1280m
    environment:
      WAHA_API_KEY: "sha512:${WAHA_API_KEY_SHA512:?defina WAHA_API_KEY_SHA512}"
      WHATSAPP_HOOK_URL: http://app:3000/api/v1/webhooks/waha
      WHATSAPP_HOOK_EVENTS: "message.any,message.ack,message.edited,message.revoked,session.status,state.change"
      WHATSAPP_HOOK_HMAC: ${WAHA_HMAC_SECRET:?defina WAHA_HMAC_SECRET}
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WAHA_DASHBOARD_ENABLED: "false"
      WHATSAPP_RESTART_ALL_SESSIONS: "True"
    volumes:
      - waha-data:/app/.sessions
      - waha-media:/app/.media
    logging: *log

  redis:
    image: redis:7.4.11-alpine3.21
    restart: unless-stopped
    mem_limit: 192m
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging: *log

  srh:
    image: hiett/serverless-redis-http@sha256:5b0bb9239fce53abf87b2018a7a0deb9ec7bd900c5360738fe5fbeeb426f9150
    restart: unless-stopped
    mem_limit: 128m
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${SRH_TOKEN:?defina SRH_TOKEN}
      SRH_CONNECTION_STRING: "redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy
    logging: *log

# Cada volume com valor explícito (`{}`), nunca a chave vazia: o painel da
# Hostinger implantou um arquivo em que `arquivos:` tinha sumido ("service db
# refers to undefined volume arquivos"), e chave sem valor é a forma que um
# editor que regrava o YAML descarta.
volumes:
  arquivos: {}
  db-data: {}
  db-config: {}
  storage-data: {}
  waha-data: {}
  waha-media: {}
