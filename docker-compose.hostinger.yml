      \x20                     local TRANSLATION_ENABLED = SUPABASE_SECRET_KEY ~= \"\" and SUPABASE_PUBLISHABLE_KEY ~= \"\" and SERVICE_ROLE_KEY_ASYMMETRIC ~= \"\" and ANON_KEY_ASYMMETRIC ~= \"\"\n\
