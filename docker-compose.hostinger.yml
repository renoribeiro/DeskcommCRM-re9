      \n\
      \x20                       local query_start = string.find(path, \"?\", 1, true)\n\
      \x20                       if query_start == nil then\n\
      \x20                         return nil\n\
      \x20                       end\n\
      \n\
      \x20                       local base = string.sub(path, 1, query_start)\n\
      \x20                       local query = string.sub(path, query_start + 1)\n\
      \x20                       local updated = {}\n\
      \x20                       local replaced = false\n\
