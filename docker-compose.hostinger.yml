# ARQUIVO GERADO - nao edite a mao.
#   Origem: infra/hostinger/compose.template.yml + docker-compose.dokploy.yml (x-crm-env) + arquivos de infra/dokploy/.
#   Para mudar: edite a origem e rode `pnpm compose:hostinger`.
#
# ImobCRM / DeskcommCRM no DOCKER MANAGER DA HOSTINGER - tudo numa VPS:
# Supabase + CRM, atras do Traefik que a Hostinger instala.
#
# COMO USAR (passo a passo em docs/imobiliario/05-instalacao-hostinger-docker-manager.md)
# --------------------------------------------------------------------------------------
#   1. No terminal da VPS, gere as variaveis:
#        bash gerar-env.sh --dominio crm.suaempresa.com.br --email voce@suaempresa.com.br --versao X.Y.Z
#   2. Docker Manager > Compose: cole ESTE ARQUIVO INTEIRO no editor YAML e o
#      bloco gerado no passo 1 nas variaveis de ambiente. Implante.
#
# AUTOCONTIDO
# -----------
#   Diferente do Dokploy, aqui o painel recebe so o YAML, sem o repositorio ao
#   lado. Por isso os arquivos do Supabase (init do banco, configuracao do
#   gateway) e o script de preparo vem DENTRO deste arquivo, em `configs:` no
#   fim. O schema do banco (baseline.sql) e baixado da tag da versao pelo setup.
#   Exige Docker Compose 2.23.1 ou mais novo (`configs` com `content`).
#
# TRAEFIK DA HOSTINGER
# --------------------
#   O Traefik da Hostinger roda com `network_mode: host`, fora de qualquer rede
#   Docker, e alcanca os conteineres pela rede padrao deste projeto
#   (<projeto>_default) - por isso `traefik.docker.network` nas labels. Nenhuma
#   porta e publicada no host: publicar o app ou o gateway abriria um caminho
#   que contorna o Traefik (e o bloqueio do webhook do WhatsApp que mora nele).
#   Dominio: DOMAIN (ex.: crmimob.re9imob.com.br), com o DNS apontando para a VPS.
#   Router e middleware levam o nome do projeto, para nao colidir com outro
#   projeto no mesmo Traefik.
#
# O QUE SOBE
# ----------
#   Supabase: db, auth, rest, realtime, storage, imgproxy e o gateway (api-gw).
#   CRM: setup (roda e sai), app, worker, scheduler, waha, redis, srh.
#   Memoria: todo servico tem mem_limit; a soma dos que ficam no ar e ~6,6 GB.
#
# Os arquivos do Supabase embutidos sao copia fixa da versao oficial
# self-hosted/v0.8.1 (infra/dokploy/supabase/, Apache-2.0).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-crm-env: &crm-env
  NODE_ENV: production
  # Diz as telas de /admin que o login (GoTrue) desta instalacao le SMTP e
  # cadastro das variaveis do Docker Manager da Hostinger - e que so uma nova
  # implantacao as aplica.
  DEPLOY_MODE: hostinger
  # -- Enderecos (apelidos unicos da rede privada; ver o cabecalho) --
  NEXT_PUBLIC_APP_URL: https://${DOMAIN:?defina DOMAIN}
  NEXT_PUBLIC_ADMIN_URL: https://${DOMAIN}
  NEXT_PUBLIC_SUPABASE_URL: https://${DOMAIN}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY:?defina ANON_KEY}
  SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:?defina SERVICE_ROLE_KEY}
  SUPABASE_DB_URL: postgresql://postgres:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}@imobcrm-db:5432/postgres
  # Vazio de proposito: o CRM fala com o banco pelo papel `postgres` do proprio
  # Supabase local; a URL de administrador e do kit com Supabase de fora.
  SUPABASE_DB_ADMIN_URL: ""
  WAHA_API_BASE_URL: http://imobcrm-waha:3000
  WAHA_WEBHOOK_BASE_URL: http://imobcrm-app:3000
  UPSTASH_REDIS_REST_URL: http://imobcrm-srh:80
  UPSTASH_REDIS_REST_TOKEN: ${SRH_TOKEN:?defina SRH_TOKEN}
  # -- Segredos obrigatorios (saem do gerar-env.sh) --
  INTERNAL_SECRET: ${INTERNAL_SECRET:?defina INTERNAL_SECRET}
  INVITE_TOKEN_SECRET: ${INVITE_TOKEN_SECRET:-}
  OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET:-}
  INTERNAL_CRON_SECRET: ${INTERNAL_CRON_SECRET:?defina INTERNAL_CRON_SECRET}
  NUVEMSHOP_OAUTH_ENCRYPTION_KEY: ${NUVEMSHOP_OAUTH_ENCRYPTION_KEY:?defina NUVEMSHOP_OAUTH_ENCRYPTION_KEY}
  CPF_ENCRYPTION_KEY: ${CPF_ENCRYPTION_KEY:?defina CPF_ENCRYPTION_KEY}
  AI_CRED_AES_KEY: ${AI_CRED_AES_KEY:?defina AI_CRED_AES_KEY}
  WAHA_BYO_ENCRYPTION_KEY: ${WAHA_BYO_ENCRYPTION_KEY:?defina WAHA_BYO_ENCRYPTION_KEY}
  IMPERSONATE_COOKIE_SECRET: ${IMPERSONATE_COOKIE_SECRET:?defina IMPERSONATE_COOKIE_SECRET}
  LGPD_SIGNING_KEY: ${LGPD_SIGNING_KEY:?defina LGPD_SIGNING_KEY}
  WAHA_API_KEY: ${WAHA_API_KEY:?defina WAHA_API_KEY}
  WAHA_HMAC_SECRET: ${WAHA_HMAC_SECRET:?defina WAHA_HMAC_SECRET}
  # Desligado por padrao, como no kit: o WAHA Core (a imagem abaixo) NAO assina
  # os webhooks - medido na 2026.7.2 (docs/testing/user-journey-map.md) -, e
  # exigir assinatura derrubaria a entrada de TODA mensagem. Ligue (true) so com
  # WAHA Plus. A defesa que vale sem assinatura e de rede: ver o `app`.
  WAHA_WEBHOOK_REQUIRE_SIGNATURE: ${WAHA_WEBHOOK_REQUIRE_SIGNATURE:-false}
  # -- Comportamento do CRM --
  APP_NAME: ${APP_NAME:-DeskcommCRM}
  APP_LOGO_URL: ${APP_LOGO_URL:-}
  APP_ACCENT_HEX: ${APP_ACCENT_HEX:-}
  SIGNUP_MODE: ${SIGNUP_MODE:-aberto}
  SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
  AGENT_DISPATCH_CONSUMER: ${AGENT_DISPATCH_CONSUMER:-engine}
  INTERNAL_AGENT_RUN_STUB: "false"
  AI_BUDGET_ENFORCEMENT: ${AI_BUDGET_ENFORCEMENT:-on}
  LLM_CALL_TIMEOUT_MS: ${LLM_CALL_TIMEOUT_MS:-90000}
  LLM_TURN_TIMEOUT_MS: ${LLM_TURN_TIMEOUT_MS:-300000}
  DISCLOSURE_MODE: ${DISCLOSURE_MODE:-}
  PROMISE_SEMANTIC_ENABLED: ${PROMISE_SEMANTIC_ENABLED:-}
  TENANT_PROVISIONING_SECRET: ${TENANT_PROVISIONING_SECRET:-}
  EXTENSIONS_LOCAL_CATALOG_ORIGIN: ${EXTENSIONS_LOCAL_CATALOG_ORIGIN:-}
  SENTRY_DSN: ${SENTRY_DSN:-off}
  # -- IA --
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
  OPENROUTER_APP_URL: ${OPENROUTER_APP_URL:-}
  OPENROUTER_APP_TITLE: ${OPENROUTER_APP_TITLE:-}
  AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
  AI_GATEWAY_BASE_URL: ${AI_GATEWAY_BASE_URL:-}
  VERCEL_AI_GATEWAY_URL: ${VERCEL_AI_GATEWAY_URL:-}
  TRANSCRIPTION_API_KEY: ${TRANSCRIPTION_API_KEY:-}
  TRANSCRIPTION_BASE_URL: ${TRANSCRIPTION_BASE_URL:-}
  TRANSCRIPTION_MODEL: ${TRANSCRIPTION_MODEL:-}
  TRANSCRIPTION_LANGUAGES: ${TRANSCRIPTION_LANGUAGES:-}
  IA_DESTINOS_INTERNOS_PERMITIDOS: ${IA_DESTINOS_INTERNOS_PERMITIDOS:-}
  JEV_API_BASE_URL: ${JEV_API_BASE_URL:-}
  # -- E-mail --
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
  SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
  # -- Notificacoes (Web Push) --
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  # -- LGPD --
  LGPD_EXPORT_EXPIRES_HOURS: ${LGPD_EXPORT_EXPIRES_HOURS:-72}
  LGPD_DPO_EMAIL: ${LGPD_DPO_EMAIL:-}
  # -- Integracoes --
  GOOGLE_CALENDAR_CLIENT_ID: ${GOOGLE_CALENDAR_CLIENT_ID:-}
  GOOGLE_CALENDAR_CLIENT_SECRET: ${GOOGLE_CALENDAR_CLIENT_SECRET:-}
  GOOGLE_ADS_DEVELOPER_TOKEN: ${GOOGLE_ADS_DEVELOPER_TOKEN:-}
  GOOGLE_ADS_OAUTH_CLIENT_ID: ${GOOGLE_ADS_OAUTH_CLIENT_ID:-}
  GOOGLE_ADS_OAUTH_CLIENT_SECRET: ${GOOGLE_ADS_OAUTH_CLIENT_SECRET:-}
  META_WEBHOOK_BASE_URL: ${META_WEBHOOK_BASE_URL:-}
  META_GRAPH_BASE_URL: ${META_GRAPH_BASE_URL:-}
  META_ADS_GRAPH_BASE_URL: ${META_ADS_GRAPH_BASE_URL:-}
  NUVEMSHOP_ENABLED: ${NUVEMSHOP_ENABLED:-false}
  NUVEMSHOP_APP_ID: ${NUVEMSHOP_APP_ID:-}
  NUVEMSHOP_CLIENT_ID: ${NUVEMSHOP_CLIENT_ID:-}
  NUVEMSHOP_CLIENT_SECRET: ${NUVEMSHOP_CLIENT_SECRET:-}
  WACALLS_API_BASE_URL: ${WACALLS_API_BASE_URL:-}
  WACALLS_API_TOKEN: ${WACALLS_API_TOKEN:-}
  DATAFY_ENABLED: ${DATAFY_ENABLED:-}
  # -- Retencao (vazio = o padrao do produto; ver lib/retencao/politica.ts) --
  WEBHOOK_LOG_BODY_RETENTION_DAYS: ${WEBHOOK_LOG_BODY_RETENTION_DAYS:-7}
  WEBHOOK_LOG_ROW_RETENTION_DAYS: ${WEBHOOK_LOG_ROW_RETENTION_DAYS:-90}
  LEAD_CAPTURE_RETENTION_DAYS: ${LEAD_CAPTURE_RETENTION_DAYS:-}
  JOB_QUEUE_RETENTION_DAYS: ${JOB_QUEUE_RETENTION_DAYS:-}
  AUDIT_LOG_RETENTION_DAYS: ${AUDIT_LOG_RETENTION_DAYS:-}
  CASE_CHAT_RETENTION_DAYS: ${CASE_CHAT_RETENTION_DAYS:-}
  PASSAGEM_RETENTION_DAYS: ${PASSAGEM_RETENTION_DAYS:-}
  CASE_ALERT_RETENTION_DAYS: ${CASE_ALERT_RETENTION_DAYS:-}
  PROSPECCAO_RETENTION_DAYS: ${PROSPECCAO_RETENTION_DAYS:-}
  JEV_OBSERVACOES_RETENTION_DAYS: ${JEV_OBSERVACOES_RETENTION_DAYS:-}
  DRAFT_RETENTION_DAYS: ${DRAFT_RETENTION_DAYS:-}
  GOLDEN_CANDIDATES_RETENTION_DAYS: ${GOLDEN_CANDIDATES_RETENTION_DAYS:-}

services:
  # ============================== SUPABASE ==================================
  db:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    mem_limit: 1536m
    networks:
      default:
        aliases: [imobcrm-db]
    configs:
      - source: db-realtime
        target: /docker-entrypoint-initdb.d/migrations/99-realtime.sql
      - source: db-webhooks
        target: /docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql
      - source: db-roles
        target: /docker-entrypoint-initdb.d/init-scripts/99-roles.sql
      - source: db-jwt
        target: /docker-entrypoint-initdb.d/init-scripts/99-jwt.sql
      - source: db-supabase
        target: /docker-entrypoint-initdb.d/migrations/97-_supabase.sql
      - source: db-logs
        target: /docker-entrypoint-initdb.d/migrations/99-logs.sql
      - source: db-pooler
        target: /docker-entrypoint-initdb.d/migrations/99-pooler.sql
    volumes:
      - db-data:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET}
      JWT_EXP: 3600
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal",
              "-c", "shared_buffers=512MB", "-c", "effective_cache_size=2GB"]
    logging: *default-logging

  auth:
    image: supabase/gotrue:v2.196.0
    restart: unless-stopped
    mem_limit: 256m
    networks:
      default:
        aliases: [imobcrm-auth]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: https://${DOMAIN}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@imobcrm-db:5432/postgres
      GOTRUE_SITE_URL: https://${DOMAIN}
      GOTRUE_URI_ALLOW_LIST: https://${DOMAIN}/auth/confirm,https://${DOMAIN}/**
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_ISSUER: https://${DOMAIN}/auth/v1
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_FROM_EMAIL:-}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USERNAME:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASSWORD:-}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_FROM_NAME:-}
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_SMS_AUTOCONFIRM: "false"
    logging: *default-logging

  rest:
    image: postgrest/postgrest:v14.17
    restart: unless-stopped
    mem_limit: 256m
    networks:
      default:
        aliases: [imobcrm-rest]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 3
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@imobcrm-db:5432/postgres
      PGRST_DB_SCHEMAS: public,graphql_public
      PGRST_DB_MAX_ROWS: 1000
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: 3600
    command: ["postgrest"]
    logging: *default-logging

  realtime:
    image: supabase/realtime:v2.134.10
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy
    networks:
      default:
        aliases: [imobcrm-realtime, realtime-dev.supabase-realtime]
    healthcheck:
      test: ["CMD-SHELL", "curl -sSfL --head -o /dev/null -H \"Authorization: Bearer ${ANON_KEY}\" http://localhost:4000/api/tenants/realtime-dev/health"]
      timeout: 5s
      interval: 30s
      retries: 3
      start_period: 10s
    environment:
      PORT: 4000
      DB_HOST: imobcrm-db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      # 16 caracteres, gerado pelo gerar-env.sh. Nao troque depois de instalar.
      DB_ENC_KEY: ${REALTIME_DB_ENC_KEY:?defina REALTIME_DB_ENC_KEY (16 caracteres, sai do gerar-env.sh)}
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?defina SECRET_KEY_BASE}
      METRICS_JWT_SECRET: ${JWT_SECRET}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      DISABLE_HEALTHCHECK_LOGGING: "true"
    logging: *default-logging

  storage:
    image: supabase/storage-api:v1.74.0
    restart: unless-stopped
    mem_limit: 384m
    networks:
      default:
        aliases: [imobcrm-storage]
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
      imgproxy:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://imobcrm-storage:5000/status"]
      timeout: 5s
      interval: 5s
      retries: 3
      start_period: 10s
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://imobcrm-rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@imobcrm-db:5432/postgres
      STORAGE_PUBLIC_URL: https://${DOMAIN}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      GLOBAL_S3_BUCKET: stub
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      ENABLE_IMAGE_TRANSFORMATION: "true"
      IMGPROXY_URL: http://imobcrm-imgproxy:5001
    volumes:
      - storage-data:/var/lib/storage
    logging: *default-logging

  imgproxy:
    image: darthsim/imgproxy:v3.31.4
    restart: unless-stopped
    mem_limit: 512m
    networks:
      default:
        aliases: [imobcrm-imgproxy]
    volumes:
      - storage-data:/var/lib/storage
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      IMGPROXY_BIND: ":5001"
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_AUTO_WEBP: "true"
      IMGPROXY_MAX_SRC_RESOLUTION: 16.8
      IMGPROXY_WORKERS: "2"
      IMGPROXY_CONCURRENCY: "2"
    logging: *default-logging

  api-gw:
    image: envoyproxy/envoy:v1.39.1
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      auth:
        condition: service_healthy
      rest:
        condition: service_started
      storage:
        condition: service_started
    networks:
      default:
        aliases: [imobcrm-gw, envoy, kong]
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/8000'"]
      interval: 10s
      timeout: 5s
      retries: 3
    configs:
      - source: gw-envoy
        target: /etc/envoy/envoy.yaml
      # O cds.yaml oficial entra INTACTO como cds.src.yaml; a entrada grava
      # /etc/envoy/cds.yaml com os apelidos imobcrm-* e chama a entrada oficial.
      - source: gw-cds
        target: /etc/envoy/cds.src.yaml
      - source: gw-entrada
        target: /gateway-entrypoint.sh
      - source: gw-lds
        target: /etc/envoy/lds.template.yaml
      - source: gw-entrada-oficial
        target: /docker-entrypoint.sh
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_PUBLISHABLE_KEY: ""
      SUPABASE_SECRET_KEY: ""
      ANON_KEY_ASYMMETRIC: ""
      SERVICE_ROLE_KEY_ASYMMETRIC: ""
      SUPABASE_PUBLIC_URL: https://${DOMAIN}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-supabase}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?defina DASHBOARD_PASSWORD}
    entrypoint: ["/bin/sh", "/gateway-entrypoint.sh"]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${COMPOSE_PROJECT_NAME}_default
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-supabase.rule=Host(`${DOMAIN}`) && (PathPrefix(`/auth/v1`) || PathPrefix(`/rest/v1`) || PathPrefix(`/realtime/v1`) || PathPrefix(`/storage/v1`) || PathPrefix(`/functions/v1`) || PathPrefix(`/graphql/v1`))
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-supabase.entrypoints=websecure
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-supabase.tls.certresolver=letsencrypt
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-supabase.priority=900
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-supabase.service=${COMPOSE_PROJECT_NAME}-supabase
      - traefik.http.services.${COMPOSE_PROJECT_NAME}-supabase.loadbalancer.server.port=8000
    logging: *default-logging

  # ================================ CRM =====================================
  # Roda a cada implantacao e sai: schema (baseline.sql da versao) e primeiro administrador.
  setup:
    image: postgres:17.6-alpine3.22
    restart: "no"
    mem_limit: 256m
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
      rest:
        condition: service_healthy
      storage:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/primeira-instalacao.sh"]
    configs:
      - source: setup-script
        target: /primeira-instalacao.sh
    environment:
      IMAGE_TAG: ${IMAGE_TAG:?defina IMAGE_TAG com uma versao publicada, ex. 1.57.0}
      # Sem o repositorio ao lado, o schema vem SEMPRE da tag da versao.
      BASELINE_FONTE: versao
      DB_URL: postgresql://postgres:${POSTGRES_PASSWORD}@imobcrm-db:5432/postgres
      AUTH_URL: http://imobcrm-auth:9999
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      OWNER_EMAIL: ${OWNER_EMAIL:?defina OWNER_EMAIL}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
      APP_LOCALE: ${APP_LOCALE:-pt-BR}
      NUVEMSHOP_OAUTH_ENCRYPTION_KEY: ${NUVEMSHOP_OAUTH_ENCRYPTION_KEY}
    logging: *default-logging

  app:
    image: ghcr.io/renoribeiro/deskcommcrm:${IMAGE_TAG:?defina IMAGE_TAG com uma versao publicada, ex. 1.57.0}
    pull_policy: missing
    restart: unless-stopped
    mem_limit: 768m
    depends_on:
      setup:
        condition: service_completed_successfully
      srh:
        condition: service_started
      waha:
        condition: service_started
    environment:
      <<: *crm-env
    networks:
      default:
        aliases: [imobcrm-app]
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    labels:
      - traefik.enable=true
      - traefik.docker.network=${COMPOSE_PROJECT_NAME}_default
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=letsencrypt
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.middlewares=${COMPOSE_PROJECT_NAME}-compress
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.service=${COMPOSE_PROJECT_NAME}
      - traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=3000
      - traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-compress.compress=true
      # O webhook GLOBAL do WAHA so e chamado de dentro (o WAHA fala com
      # http://imobcrm-app:3000). Pelo Traefik ele e negado.
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-waha-block.rule=Host(`${DOMAIN}`) && Path(`/api/v1/webhooks/waha`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-waha-block.entrypoints=websecure
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-waha-block.tls.certresolver=letsencrypt
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-waha-block.priority=1000
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-waha-block.service=${COMPOSE_PROJECT_NAME}
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-waha-block.middlewares=${COMPOSE_PROJECT_NAME}-deny
      - traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-deny.ipallowlist.sourcerange=192.0.2.1/32
    logging: *default-logging

  worker:
    image: ghcr.io/renoribeiro/deskcomm-worker:${IMAGE_TAG:?defina IMAGE_TAG com uma versao publicada, ex. 1.57.0}
    pull_policy: missing
    restart: unless-stopped
    mem_limit: 512m
    networks:
      default:
        aliases: [imobcrm-worker]
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      <<: *crm-env
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging

  scheduler:
    image: ghcr.io/renoribeiro/deskcomm-scheduler:${IMAGE_TAG:?defina IMAGE_TAG com uma versao publicada, ex. 1.57.0}
    pull_policy: missing
    restart: unless-stopped
    mem_limit: 128m
    networks:
      default:
        aliases: [imobcrm-scheduler]
    depends_on:
      app:
        condition: service_healthy
    environment:
      TZ: UTC
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      SCHEDULER_APP_ORIGIN: http://imobcrm-app:3000
    logging: *default-logging

  waha:
    image: devlikeapro/waha:latest-2026.7.2
    restart: unless-stopped
    mem_limit: 1280m
    networks:
      default:
        aliases: [imobcrm-waha]
    environment:
      WAHA_API_KEY: "sha512:${WAHA_API_KEY_SHA512:?defina WAHA_API_KEY_SHA512}"
      WHATSAPP_HOOK_URL: http://imobcrm-app:3000/api/v1/webhooks/waha
      WHATSAPP_HOOK_EVENTS: "message.any,message.ack,message.edited,message.revoked,session.status,state.change"
      WHATSAPP_HOOK_HMAC: ${WAHA_HMAC_SECRET}
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WAHA_DASHBOARD_ENABLED: "false"
      WHATSAPP_RESTART_ALL_SESSIONS: "True"
    volumes:
      - waha-data:/app/.sessions
      - waha-media:/app/.media
    logging: *default-logging

  redis:
    image: redis:7.4.11-alpine3.21
    restart: unless-stopped
    mem_limit: 192m
    networks:
      default:
        aliases: [imobcrm-redis]
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging: *default-logging

  srh:
    image: hiett/serverless-redis-http@sha256:5b0bb9239fce53abf87b2018a7a0deb9ec7bd900c5360738fe5fbeeb426f9150
    restart: unless-stopped
    mem_limit: 128m
    networks:
      default:
        aliases: [imobcrm-srh]
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${SRH_TOKEN}
      SRH_CONNECTION_STRING: "redis://imobcrm-redis:6379"
    depends_on:
      redis:
        condition: service_healthy
    logging: *default-logging

volumes:
  db-data:
  db-config:
  storage-data:
  waha-data:
  waha-media:

# ===================== ARQUIVOS EMBUTIDOS (gerados) =======================
configs:
  db-realtime:
    content: |
      \set pguser `echo "$$POSTGRES_USER"`

      create schema if not exists _realtime;
      alter schema _realtime owner to :pguser;
  db-webhooks:
    content: |
      BEGIN;
        -- Create pg_net extension
        CREATE EXTENSION IF NOT EXISTS pg_net SCHEMA extensions;
        -- Create supabase_functions schema
        CREATE SCHEMA supabase_functions AUTHORIZATION supabase_admin;
        GRANT USAGE ON SCHEMA supabase_functions TO postgres, anon, authenticated, service_role;
        ALTER DEFAULT PRIVILEGES IN SCHEMA supabase_functions GRANT ALL ON TABLES TO postgres, anon, authenticated, service_role;
        ALTER DEFAULT PRIVILEGES IN SCHEMA supabase_functions GRANT ALL ON FUNCTIONS TO postgres, anon, authenticated, service_role;
        ALTER DEFAULT PRIVILEGES IN SCHEMA supabase_functions GRANT ALL ON SEQUENCES TO postgres, anon, authenticated, service_role;
        -- supabase_functions.migrations definition
        CREATE TABLE supabase_functions.migrations (
          version text PRIMARY KEY,
          inserted_at timestamptz NOT NULL DEFAULT NOW()
        );
        -- Initial supabase_functions migration
        INSERT INTO supabase_functions.migrations (version) VALUES ('initial');
        -- supabase_functions.hooks definition
        CREATE TABLE supabase_functions.hooks (
          id bigserial PRIMARY KEY,
          hook_table_id integer NOT NULL,
          hook_name text NOT NULL,
          created_at timestamptz NOT NULL DEFAULT NOW(),
          request_id bigint
        );
        CREATE INDEX supabase_functions_hooks_request_id_idx ON supabase_functions.hooks USING btree (request_id);
        CREATE INDEX supabase_functions_hooks_h_table_id_h_name_idx ON supabase_functions.hooks USING btree (hook_table_id, hook_name);
        COMMENT ON TABLE supabase_functions.hooks IS 'Supabase Functions Hooks: Audit trail for triggered hooks.';
        CREATE FUNCTION supabase_functions.http_request()
          RETURNS trigger
          LANGUAGE plpgsql
          AS $$function$$
          DECLARE
            request_id bigint;
            payload jsonb;
            url text := TG_ARGV[0]::text;
            method text := TG_ARGV[1]::text;
            headers jsonb DEFAULT '{}'::jsonb;
            params jsonb DEFAULT '{}'::jsonb;
            timeout_ms integer DEFAULT 1000;
          BEGIN
            IF url IS NULL OR url = 'null' THEN
              RAISE EXCEPTION 'url argument is missing';
            END IF;

            IF method IS NULL OR method = 'null' THEN
              RAISE EXCEPTION 'method argument is missing';
            END IF;

            IF TG_ARGV[2] IS NULL OR TG_ARGV[2] = 'null' THEN
              headers = '{"Content-Type": "application/json"}'::jsonb;
            ELSE
              headers = TG_ARGV[2]::jsonb;
            END IF;

            IF TG_ARGV[3] IS NULL OR TG_ARGV[3] = 'null' THEN
              params = '{}'::jsonb;
            ELSE
              params = TG_ARGV[3]::jsonb;
            END IF;

            IF TG_ARGV[4] IS NULL OR TG_ARGV[4] = 'null' THEN
              timeout_ms = 1000;
            ELSE
              timeout_ms = TG_ARGV[4]::integer;
            END IF;

            CASE
              WHEN method = 'GET' THEN
                SELECT http_get INTO request_id FROM net.http_get(
                  url,
                  params,
                  headers,
                  timeout_ms
                );
              WHEN method = 'POST' THEN
                payload = jsonb_build_object(
                  'old_record', OLD,
                  'record', NEW,
                  'type', TG_OP,
                  'table', TG_TABLE_NAME,
                  'schema', TG_TABLE_SCHEMA
                );

                SELECT http_post INTO request_id FROM net.http_post(
                  url,
                  payload,
                  params,
                  headers,
                  timeout_ms
                );
              ELSE
                RAISE EXCEPTION 'method argument % is invalid', method;
            END CASE;

            INSERT INTO supabase_functions.hooks
              (hook_table_id, hook_name, request_id)
            VALUES
              (TG_RELID, TG_NAME, request_id);

            RETURN NEW;
          END
        $$function$$;
        -- Supabase super admin
        DO
        $$$$
        BEGIN
          IF NOT EXISTS (
            SELECT 1
            FROM pg_roles
            WHERE rolname = 'supabase_functions_admin'
          )
          THEN
            CREATE USER supabase_functions_admin NOINHERIT CREATEROLE LOGIN NOREPLICATION;
          END IF;
        END
        $$$$;
        GRANT ALL PRIVILEGES ON SCHEMA supabase_functions TO supabase_functions_admin;
        GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA supabase_functions TO supabase_functions_admin;
        GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA supabase_functions TO supabase_functions_admin;
        ALTER USER supabase_functions_admin SET search_path = "supabase_functions";
        ALTER table "supabase_functions".migrations OWNER TO supabase_functions_admin;
        ALTER table "supabase_functions".hooks OWNER TO supabase_functions_admin;
        ALTER function "supabase_functions".http_request() OWNER TO supabase_functions_admin;
        GRANT supabase_functions_admin TO postgres;
        -- Remove unused supabase_pg_net_admin role
        DO
        $$$$
        BEGIN
          IF EXISTS (
            SELECT 1
            FROM pg_roles
            WHERE rolname = 'supabase_pg_net_admin'
          )
          THEN
            REASSIGN OWNED BY supabase_pg_net_admin TO supabase_admin;
            DROP OWNED BY supabase_pg_net_admin;
            DROP ROLE supabase_pg_net_admin;
          END IF;
        END
        $$$$;
        -- pg_net grants when extension is already enabled
        DO
        $$$$
        BEGIN
          IF EXISTS (
            SELECT 1
            FROM pg_extension
            WHERE extname = 'pg_net'
          )
          THEN
            GRANT USAGE ON SCHEMA net TO supabase_functions_admin, postgres, anon, authenticated, service_role;
            ALTER function net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) SECURITY DEFINER;
            ALTER function net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) SECURITY DEFINER;
            ALTER function net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) SET search_path = net;
            ALTER function net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) SET search_path = net;
            REVOKE ALL ON FUNCTION net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) FROM PUBLIC;
            REVOKE ALL ON FUNCTION net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) FROM PUBLIC;
            GRANT EXECUTE ON FUNCTION net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) TO supabase_functions_admin, postgres, anon, authenticated, service_role;
            GRANT EXECUTE ON FUNCTION net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) TO supabase_functions_admin, postgres, anon, authenticated, service_role;
          END IF;
        END
        $$$$;
        -- Event trigger for pg_net
        CREATE OR REPLACE FUNCTION extensions.grant_pg_net_access()
        RETURNS event_trigger
        LANGUAGE plpgsql
        AS $$$$
        BEGIN
          IF EXISTS (
            SELECT 1
            FROM pg_event_trigger_ddl_commands() AS ev
            JOIN pg_extension AS ext
            ON ev.objid = ext.oid
            WHERE ext.extname = 'pg_net'
          )
          THEN
            GRANT USAGE ON SCHEMA net TO supabase_functions_admin, postgres, anon, authenticated, service_role;
            ALTER function net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) SECURITY DEFINER;
            ALTER function net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) SECURITY DEFINER;
            ALTER function net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) SET search_path = net;
            ALTER function net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) SET search_path = net;
            REVOKE ALL ON FUNCTION net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) FROM PUBLIC;
            REVOKE ALL ON FUNCTION net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) FROM PUBLIC;
            GRANT EXECUTE ON FUNCTION net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) TO supabase_functions_admin, postgres, anon, authenticated, service_role;
            GRANT EXECUTE ON FUNCTION net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) TO supabase_functions_admin, postgres, anon, authenticated, service_role;
          END IF;
        END;
        $$$$;
        COMMENT ON FUNCTION extensions.grant_pg_net_access IS 'Grants access to pg_net';
        DO
        $$$$
        BEGIN
          IF NOT EXISTS (
            SELECT 1
            FROM pg_event_trigger
            WHERE evtname = 'issue_pg_net_access'
          ) THEN
            CREATE EVENT TRIGGER issue_pg_net_access ON ddl_command_end WHEN TAG IN ('CREATE EXTENSION')
            EXECUTE PROCEDURE extensions.grant_pg_net_access();
          END IF;
        END
        $$$$;
        INSERT INTO supabase_functions.migrations (version) VALUES ('20210809183423_update_grants');
        ALTER function supabase_functions.http_request() SECURITY DEFINER;
        ALTER function supabase_functions.http_request() SET search_path = supabase_functions;
        REVOKE ALL ON FUNCTION supabase_functions.http_request() FROM PUBLIC;
        GRANT EXECUTE ON FUNCTION supabase_functions.http_request() TO postgres, anon, authenticated, service_role;
      COMMIT;
  db-roles:
    content: |
      -- NOTE: change to your own passwords for production environments
      \set pgpass `echo "$$POSTGRES_PASSWORD"`

      ALTER USER authenticator WITH PASSWORD :'pgpass';
      ALTER USER pgbouncer WITH PASSWORD :'pgpass';
      ALTER USER supabase_auth_admin WITH PASSWORD :'pgpass';
      ALTER USER supabase_functions_admin WITH PASSWORD :'pgpass';
      ALTER USER supabase_storage_admin WITH PASSWORD :'pgpass';
  db-jwt:
    content: |
      \set jwt_secret `echo "$$JWT_SECRET"`
      \set jwt_exp `echo "$$JWT_EXP"`

      ALTER DATABASE postgres SET "app.settings.jwt_secret" TO :'jwt_secret';
      ALTER DATABASE postgres SET "app.settings.jwt_exp" TO :'jwt_exp';
  db-supabase:
    content: |
      \set pguser `echo "$$POSTGRES_USER"`

      CREATE DATABASE _supabase WITH OWNER :pguser;
  db-logs:
    content: |
      \set pguser `echo "$$POSTGRES_USER"`

      \c _supabase
      create schema if not exists _analytics;
      alter schema _analytics owner to :pguser;
      \c postgres
  db-pooler:
    content: |
      \set pguser `echo "$$POSTGRES_USER"`

      \c _supabase
      create schema if not exists _supavisor;
      alter schema _supavisor owner to :pguser;
      \c postgres
  gw-envoy:
    content: |
      dynamic_resources:
        cds_config:
          path_config_source:
            path: /etc/envoy/cds.yaml
          resource_api_version: V3
        lds_config:
          path_config_source:
            path: /etc/envoy/lds.yaml
          resource_api_version: V3

      node:
        cluster: supabase_cluster
        id: supabase_node

      overload_manager:
        resource_monitors:
          - name: envoy.resource_monitors.global_downstream_max_connections
            typed_config:
              '@type': >-
                type.googleapis.com/envoy.extensions.resource_monitors.downstream_connections.v3.DownstreamConnectionsConfig
              max_active_downstream_connections: 30000

      admin:
        address:
          socket_address:
            address: 127.0.0.1
            port_value: 9901
  gw-cds:
    content: |
      resources:
        - '@type': type.googleapis.com/envoy.config.cluster.v3.Cluster
          name: auth
          connect_timeout: 5s
          type: STRICT_DNS
          dns_refresh_rate: 5s
          dns_failure_refresh_rate:
            base_interval: 1s
            max_interval: 1s
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: auth
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: auth
                          port_value: 9999
          health_checks:
            - timeout: 2s
              interval: 5s
              unhealthy_threshold: 3
              healthy_threshold: 2
              http_health_check:
                path: /health
          circuit_breakers:
            thresholds:
              - priority: DEFAULT
                max_connections: 10000
                max_pending_requests: 10000
                max_requests: 10000

        - '@type': type.googleapis.com/envoy.config.cluster.v3.Cluster
          name: rest
          connect_timeout: 5s
          type: STRICT_DNS
          dns_refresh_rate: 5s
          dns_failure_refresh_rate:
            base_interval: 1s
            max_interval: 1s
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: rest
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: rest
                          port_value: 3000
          health_checks:
            - timeout: 2s
              interval: 5s
              unhealthy_threshold: 3
              healthy_threshold: 2
              http_health_check:
                path: /
          circuit_breakers:
            thresholds:
              - priority: DEFAULT
                max_connections: 10000
                max_pending_requests: 10000
                max_requests: 10000

        - '@type': type.googleapis.com/envoy.config.cluster.v3.Cluster
          name: realtime
          connect_timeout: 5s
          type: STRICT_DNS
          dns_refresh_rate: 5s
          dns_failure_refresh_rate:
            base_interval: 1s
            max_interval: 1s
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: realtime
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: realtime-dev.supabase-realtime
                          port_value: 4000
          health_checks:
            - timeout: 2s
              interval: 5s
              unhealthy_threshold: 3
              healthy_threshold: 2
              http_health_check:
                path: /
          circuit_breakers:
            thresholds:
              - priority: DEFAULT
                max_connections: 10000
                max_pending_requests: 10000
                max_requests: 10000

        - '@type': type.googleapis.com/envoy.config.cluster.v3.Cluster
          name: storage
          connect_timeout: 5s
          type: STRICT_DNS
          dns_refresh_rate: 5s
          dns_failure_refresh_rate:
            base_interval: 1s
            max_interval: 1s
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: storage
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: storage
                          port_value: 5000
          health_checks:
            - timeout: 2s
              interval: 5s
              unhealthy_threshold: 3
              healthy_threshold: 2
              http_health_check:
                path: /status
          circuit_breakers:
            thresholds:
              - priority: DEFAULT
                max_connections: 10000
                max_pending_requests: 10000
                max_requests: 10000

        - '@type': type.googleapis.com/envoy.config.cluster.v3.Cluster
          name: functions
          connect_timeout: 5s
          type: STRICT_DNS
          dns_refresh_rate: 5s
          dns_failure_refresh_rate:
            base_interval: 1s
            max_interval: 1s
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: functions
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: functions
                          port_value: 9000
          health_checks:
            - timeout: 2s
              interval: 5s
              unhealthy_threshold: 3
              healthy_threshold: 2
              tcp_health_check: {}
          circuit_breakers:
            thresholds:
              - priority: DEFAULT
                max_connections: 10000
                max_pending_requests: 10000
                max_requests: 10000

        - '@type': type.googleapis.com/envoy.config.cluster.v3.Cluster
          name: meta
          connect_timeout: 5s
          type: STRICT_DNS
          dns_refresh_rate: 5s
          dns_failure_refresh_rate:
            base_interval: 1s
            max_interval: 1s
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: meta
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: meta
                          port_value: 8080
          health_checks:
            - timeout: 2s
              interval: 5s
              unhealthy_threshold: 3
              healthy_threshold: 2
              http_health_check:
                path: /health
          circuit_breakers:
            thresholds:
              - priority: DEFAULT
                max_connections: 10000
                max_pending_requests: 10000
                max_requests: 10000

        - '@type': type.googleapis.com/envoy.config.cluster.v3.Cluster
          name: studio
          connect_timeout: 5s
          type: STRICT_DNS
          dns_refresh_rate: 5s
          dns_failure_refresh_rate:
            base_interval: 1s
            max_interval: 1s
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: studio
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: studio
                          port_value: 3000
          health_checks:
            - timeout: 2s
              interval: 5s
              unhealthy_threshold: 3
              healthy_threshold: 2
              http_health_check:
                path: /project/default
          circuit_breakers:
            thresholds:
              - priority: DEFAULT
                max_connections: 10000
                max_pending_requests: 10000
                max_requests: 10000
  gw-lds:
    content: "resources:\n\
      \x20 - '@type': type.googleapis.com/envoy.config.listener.v3.Listener\n\
      \x20   name: supabase\n\
      \x20   per_connection_buffer_limit_bytes: 32768  # 32 KiB\n\
      \n\
      \x20   address:\n\
      \x20     socket_address:\n\
      \x20       address: 0.0.0.0\n\
      \x20       port_value: 8000\n\
      \n\
      \x20   filter_chains:\n\
      \x20     - filters:\n\
      \x20         - name: envoy.filters.network.http_connection_manager\n\
      \x20           typed_config:\n\
      \x20             '@type': >-\n\
