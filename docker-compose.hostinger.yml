      \x20               # Synthesizes an Authorization header (Bearer \u2026) from apikey when callers don\u2019t provide a real JWT header.\n\
      \x20               - name: envoy.filters.http.lua\n\
      \x20                 typed_config:\n\
      \x20                   '@type': >-\n\
      \x20                     type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua\n\
      \x20                   inline_code: |\n\
      \x20                     local FUNCTIONS_ROUTE = \"functions-v1-all\"\n\
      \x20                     local FUNCTIONS_PREFIX = \"/functions/v1/\"\n\
      \x20                     local REALTIME_WS_ROUTE = \"realtime-v1-ws-protected\"\n\
      \n\
      \x20                     local function is_functions_request(request_handle, headers)\n\
      \x20                       if request_handle:streamInfo():routeName() == FUNCTIONS_ROUTE then\n\
      \x20                         return true\n\
      \x20                       end\n\
      \n\
      \x20                       local path = headers:get(\":path\")\n\
      \x20                       if path == nil then\n\
      \x20                         return false\n\
      \x20                       end\n\
      \n\
      \x20                       return string.sub(path, 1, string.len(FUNCTIONS_PREFIX)) == FUNCTIONS_PREFIX\n\
      \x20                     end\n\
      \n\
      \x20                     local function has_real_jwt(auth_header)\n\
      \x20                       if auth_header == nil or auth_header == \"\" then\n\
      \x20                         return false\n\
      \x20                       end\n\
      \n\
      \x20                       if string.sub(auth_header, 1, 7) ~= \"Bearer \" then\n\
      \x20                         return false\n\
      \x20                       end\n\
      \n\
      \x20                       return string.sub(auth_header, 1, 10) ~= \"Bearer sb_\"\n\
      \x20                     end\n\
      \n\
      \x20                     local function format_authorization(value)\n\
      \x20                       if value == nil or value == \"\" then\n\
      \x20                         return nil\n\
      \x20                       end\n\
      \n\
      \x20                       if string.sub(value, 1, 7) == \"Bearer \" then\n\
      \x20                         return value\n\
      \x20                       end\n\
      \n\
      \x20                       return \"Bearer \" .. value\n\
      \x20                     end\n\
      \n\
      \x20                     function envoy_on_request(request_handle)\n\
      \x20                       local headers = request_handle:headers()\n\
      \x20                       if request_handle:streamInfo():routeName() == REALTIME_WS_ROUTE then\n\
      \x20                         return\n\
      \x20                       end\n\
      \n\
      \x20                       if is_functions_request(request_handle, headers) then\n\
      \x20                         return\n\
      \x20                       end\n\
      \n\
      \x20                       if has_real_jwt(headers:get(\"authorization\")) then\n\
      \x20                         return\n\
      \x20                       end\n\
      \n\
      \x20                       local apikey = headers:get(\"apikey\")\n\
      \x20                       local authorization_value = format_authorization(apikey)\n\
      \x20                       if authorization_value ~= nil then\n\
      \x20                         headers:replace(\"authorization\", authorization_value)\n\
      \x20                       end\n\
      \x20                     end\n\
      \n\
      \x20               - name: envoy.filters.http.rbac\n\
      \x20                 typed_config:\n\
      \x20                   '@type': >-\n\
      \x20                     type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC\n\
      \x20                   rules:\n\
      \x20                     action: ALLOW\n\
      \x20                     policies:\n\
      \x20                       admin:\n\
      \x20                         permissions:\n\
      \x20                           - url_path:\n\
      \x20                               path:\n\
      \x20                                 prefix: /pg/\n\
      \x20                         principals:\n\
      \x20                           - header:\n\
      \x20                               name: apikey\n\
      \x20                               string_match:\n\
      \x20                                 exact: '$${SERVICE_ROLE_KEY}'\n\
      \x20                           - header:\n\
      \x20                               name: apikey\n\
      \x20                               string_match:\n\
      \x20                                 exact: '$${SERVICE_ROLE_KEY_ASYMMETRIC}'\n\
      \x20                       apikey:\n\
      \x20                         permissions:\n\
      \x20                           - url_path:\n\
      \x20                               path:\n\
      \x20                                 prefix: /auth/v1/\n\
      \x20                           - url_path:\n\
      \x20                               path:\n\
      \x20                                 prefix: /rest/v1/\n\
      \x20                           - url_path:\n\
      \x20                               path:\n\
      \x20                                 prefix: /realtime/v1/api\n\
      \x20                           - url_path:\n\
      \x20                               path:\n\
      \x20                                 prefix: /realtime/v1/\n\
      \x20                           - url_path:\n\
      \x20                               path:\n\
      \x20                                 prefix: /graphql/v1\n\
      \x20                         principals:\n\
      \x20                           - header:\n\
      \x20                               name: apikey\n\
      \x20                               string_match:\n\
      \x20                                 exact: '$${SERVICE_ROLE_KEY}'\n\
      \x20                           - header:\n\
      \x20                               name: apikey\n\
      \x20                               string_match:\n\
      \x20                                 exact: '$${ANON_KEY}'\n\
      \x20                           - header:\n\
      \x20                               name: apikey\n\
      \x20                               string_match:\n\
      \x20                                 exact: '$${SERVICE_ROLE_KEY_ASYMMETRIC}'\n\
      \x20                           - header:\n\
      \x20                               name: apikey\n\
      \x20                               string_match:\n\
      \x20                                 exact: '$${ANON_KEY_ASYMMETRIC}'\n\
      \x20               - name: envoy.filters.http.router\n\
      \x20                 typed_config:\n\
      \x20                   '@type': >-\n\
      \x20                     type.googleapis.com/envoy.extensions.filters.http.router.v3.Router\n\
      "
  gw-entrada-oficial:
    content: |
      #!/bin/sh
      set -e

      # Generate SHA1 base64 hash for Envoy basic auth user list
      PASSWORD_HASH=$$(printf '%s' "$${DASHBOARD_PASSWORD}" | openssl sha1 -binary | openssl base64)
      DASHBOARD_BASIC_AUTH="$${DASHBOARD_USERNAME}:{SHA}$${PASSWORD_HASH}"

      echo "Generating Envoy configuration..."

      # Process the lds.yaml template with environment variables using sed
      # Using | as delimiter since JWT tokens contain /
      sed -e "s|\$${ANON_KEY}|$${ANON_KEY}|g" \
          -e "s|\$${ANON_KEY_ASYMMETRIC}|$${ANON_KEY_ASYMMETRIC}|g" \
          -e "s|\$${SERVICE_ROLE_KEY}|$${SERVICE_ROLE_KEY}|g" \
          -e "s|\$${SERVICE_ROLE_KEY_ASYMMETRIC}|$${SERVICE_ROLE_KEY_ASYMMETRIC}|g" \
          -e "s|\$${SUPABASE_PUBLISHABLE_KEY}|$${SUPABASE_PUBLISHABLE_KEY}|g" \
          -e "s|\$${SUPABASE_SECRET_KEY}|$${SUPABASE_SECRET_KEY}|g" \
          -e "s|\$${SUPABASE_PUBLIC_URL}|$${SUPABASE_PUBLIC_URL}|g" \
          -e "s|\$${DASHBOARD_BASIC_AUTH}|$${DASHBOARD_BASIC_AUTH}|g" \
          /etc/envoy/lds.template.yaml > /etc/envoy/lds.yaml

      if [ -n "$$SUPABASE_SECRET_KEY" ] && \
         [ -n "$$SUPABASE_PUBLISHABLE_KEY" ] && \
         [ -n "$$SERVICE_ROLE_KEY_ASYMMETRIC" ] && \
         [ -n "$$ANON_KEY_ASYMMETRIC" ]; then
        echo "Envoy sb_ key translation enabled"
      else
        echo "Envoy running in legacy API key mode (sb_ keys disabled)"
      fi

      echo "Envoy configuration generated successfully"
      echo "Starting Envoy..."

      # Start Envoy
      exec envoy -c /etc/envoy/envoy.yaml "$$@"
  gw-entrada:
    content: "#!/bin/sh\n\
      # Entrada do servi\u00e7o `api-gw` (Envoy) do docker-compose.dokploy.yml.\n\
      #\n\
      # O `cds.yaml` oficial do Supabase aponta cada rota para o NOME do servi\u00e7o\n\
      # (`auth`, `rest`, `storage`, `realtime-dev.supabase-realtime`\u2026). No Dokploy o\n\
      # gateway tamb\u00e9m est\u00e1 na rede compartilhada do Traefik (`dokploy-network`), e l\u00e1\n\
      # `auth` ou `rest` podem ser o cont\u00eainer de OUTRO sistema: o Envoy mandaria\n\
      # senha e token de login para quem ganhasse a resolu\u00e7\u00e3o de nome.\n\
      #\n\
      # Por isso cada servi\u00e7o interno tem um apelido \u00fanico (`imobcrm-*`, s\u00f3 na rede\n\
      # privada do compose), e aqui o `cds.yaml` \u00e9 reescrito para esses apelidos na\n\
      # partida. O arquivo vendorizado (infra/dokploy/supabase/) fica intacto: ele \u00e9\n\
      # montado em CDS_ORIGEM e a c\u00f3pia reescrita vai para CDS_DESTINO, que \u00e9 o\n\
      # caminho que o envoy.yaml oficial l\u00ea.\n\
      #\n\
      # Falha FECHADA: se sobrar algum endere\u00e7o fora de `imobcrm-*` (o formato do\n\
      # arquivo mudou numa troca de vers\u00e3o do Supabase, por exemplo), o gateway n\u00e3o\n\
      # sobe \u2014 melhor um erro vis\u00edvel no log do Dokploy do que tr\u00e1fego para o vizinho.\n\
      #\n\
      # Os caminhos s\u00e3o injet\u00e1veis s\u00f3 para o teste (tests/shell/dokploy-compose.test.sh).\n\
      set -eu\n\
      \n\
      CDS_ORIGEM=\"$${CDS_ORIGEM:-/etc/envoy/cds.src.yaml}\"\n\
      CDS_DESTINO=\"$${CDS_DESTINO:-/etc/envoy/cds.yaml}\"\n\
      ENTRADA_OFICIAL=\"$${ENTRADA_OFICIAL:-/docker-entrypoint.sh}\"\n\
      PREFIXO=\"$${ALIAS_PREFIXO:-imobcrm-}\"\n\
      \n\
      sed -E \\\n\
      \x20 -e \"s/^([[:space:]]+address:[[:space:]]+)(auth|rest|storage|functions|meta|studio)[[:space:]]*\\$$/\\\\1$${PREFIXO}\\\\2/\" \\\n\
      \x20 -e \"s/^([[:space:]]+address:[[:space:]]+)realtime-dev\\\\.supabase-realtime[[:space:]]*\\$$/\\\\1$${PREFIXO}realtime/\" \\\n\
      \x20 \"$$CDS_ORIGEM\" > \"$$CDS_DESTINO\"\n\
      \n\
      sobras=\"$$(grep -E '^[[:space:]]+address:[[:space:]]' \"$$CDS_DESTINO\" | grep -v \"address: $${PREFIXO}\" || true)\"\n\
      if [ -n \"$$sobras\" ]; then\n\
      \x20 echo \"api-gw: endere\u00e7o sem apelido \u00fanico no cds.yaml \u2014 recuso subir:\" >&2\n\
      \x20 printf '%s\\n' \"$$sobras\" >&2\n\
      \x20 exit 1\n\
      fi\n\
      echo \"api-gw: cds.yaml reescrito para os apelidos $${PREFIXO}*\"\n\
      \n\
      exec /bin/sh \"$$ENTRADA_OFICIAL\" \"$$@\"\n\
      "
  setup-script:
    content: "#!/bin/sh\n\
      # Servi\u00e7o `setup` do docker-compose.dokploy.yml. Roda a cada deploy, ANTES do\n\
      # app, dentro de um cont\u00eainer postgres:17.6-alpine3.22 (psql + wget do busybox).\n\
      #\n\
      # Faz o que o hostgator-setup-kit/install.sh faz na instala\u00e7\u00e3o, na mesma ordem\n\
      # e com as mesmas regras:\n\
      #   1. extens\u00f5es vector, citext e pg_trgm no schema public;\n\
      #   2. baseline.sql: banco NOVO com ON_ERROR_STOP (schema incompleto = sem RLS,\n\
      #      ent\u00e3o falha alto); banco EXISTENTE reaplicado em modo update, porque o\n\
      #      baseline \u00e9 idempotente e auto-curativo \u2014 \u00e9 como as atualiza\u00e7\u00f5es chegam;\n\
      #   3. chave de cifra dos segredos em private.app_secrets (ensure_encryption_key);\n\
      #   4. primeiro dono: criado no Auth (GoTrue) e promovido a admin da primeira\n\
      #      organiza\u00e7\u00e3o e a super-admin da plataforma, com mfa_required=false\n\
      #      expl\u00edcito (o mesmo INSERT do install.sh, e o porqu\u00ea est\u00e1 l\u00e1).\n\
      #\n\
      # Idempotente: rodar de novo n\u00e3o duplica nada nem troca a senha do dono.\n\
      set -eu\n\
      \n\
      : \"$${DB_URL:?DB_URL ausente}\"\n\
      : \"$${AUTH_URL:?AUTH_URL ausente}\"\n\
      : \"$${SERVICE_ROLE_KEY:?SERVICE_ROLE_KEY ausente}\"\n\
      : \"$${OWNER_EMAIL:?OWNER_EMAIL ausente}\"\n\
      # OWNER_PASSWORD s\u00f3 \u00e9 exigida enquanto o dono n\u00e3o existe (conferido abaixo):\n\
      # depois da instala\u00e7\u00e3o ela pode sair do Environment do Dokploy.\n\
      OWNER_PASSWORD=\"$${OWNER_PASSWORD:-}\"\n\
      : \"$${NUVEMSHOP_OAUTH_ENCRYPTION_KEY:?NUVEMSHOP_OAUTH_ENCRYPTION_KEY ausente}\"\n\
      LOCALE=\"$${APP_LOCALE:-pt-BR}\"\n\
      # De onde vem o baseline.sql. O app, o worker e o scheduler rodam a imagem da\n\
      # vers\u00e3o IMAGE_TAG; o arquivo montado do clone \u00e9 o da PONTA da branch que o\n\
      # Dokploy puxou \u2014 que pode estar \u00e0 frente (ou atr\u00e1s) da imagem. Schema de uma\n\
      # vers\u00e3o com c\u00f3digo de outra \u00e9 o defeito que n\u00e3o aparece no deploy e aparece\n\
      # na tela. Por isso o padr\u00e3o \u00e9 baixar o baseline da TAG v$${IMAGE_TAG}:\n\
      #   BASELINE_FONTE=versao (padr\u00e3o) \u2192 baixa o da tag; se n\u00e3o conseguir, FALHA.\n\
      #   BASELINE_FONTE=clone           \u2192 usa o arquivo montado (desenvolvimento e\n\
      #                                    teste; nunca numa instala\u00e7\u00e3o de cliente).\n\
      BASELINE_FONTE=\"$${BASELINE_FONTE:-versao}\"\n\
      BASELINE_REPO=\"$${BASELINE_REPO:-renoribeiro/DeskcommCRM-re9}\"\n\
      # Avisos de \"j\u00e1 existe\" viram ru\u00eddo no log do Dokploy; erro de verdade continua aparecendo.\n\
      export PGOPTIONS=\"$${PGOPTIONS:-} -c client_min_messages=warning\"\n\
      \n\
      log() { printf '[setup] %s\\n' \"$$*\"; }\n\
      q() { psql \"$$DB_URL\" -v ON_ERROR_STOP=1 -tAq \"$$@\"; }\n\
      \n\
      # O log da aplica\u00e7\u00e3o do baseline e o arquivo baixado moram num diret\u00f3rio do\n\
      # pr\u00f3prio processo (n\u00e3o em /tmp/baseline.log fixo).\n\
      TRABALHO=\"$$(mktemp -d)\"\n\
      trap 'rm -rf \"$$TRABALHO\"' EXIT\n\
      BASELINE_LOG=\"$$TRABALHO/baseline.log\"\n\
      \n\
      case \"$$BASELINE_FONTE\" in\n\
      \x20 clone)\n\
      \x20   BASELINE=\"$${BASELINE:-/baseline.sql}\"\n\
      \x20   log \"BASELINE_FONTE=clone: usando o baseline do clone ($$BASELINE), n\u00e3o o da vers\u00e3o $${IMAGE_TAG:-?} \u2014 s\u00f3 para desenvolvimento e teste\"\n\
      \x20   ;;\n\
      \x20 versao)\n\
      \x20   : \"$${IMAGE_TAG:?IMAGE_TAG ausente: o setup aplica o baseline da mesma vers\u00e3o das imagens}\"\n\
      \x20   url=\"https://raw.githubusercontent.com/$${BASELINE_REPO}/v$${IMAGE_TAG}/supabase/baseline.sql\"\n\
      \x20   BASELINE=\"$$TRABALHO/baseline.sql\"\n\
      \x20   log \"baixando o schema da vers\u00e3o $${IMAGE_TAG}: $$url\"\n\
      \x20   if ! wget -q -T 60 -O \"$$BASELINE\" \"$$url\" 2>\"$$TRABALHO/wget.err\"; then\n\
      \x20     log \"N\u00c3O consegui baixar o schema da vers\u00e3o $${IMAGE_TAG} ($$(tail -1 \"$$TRABALHO/wget.err\" 2>/dev/null)).\"\n\
      \x20     log \"confira se a tag v$${IMAGE_TAG} existe em https://github.com/$${BASELINE_REPO}/tags e se a VPS alcan\u00e7a raw.githubusercontent.com; depois fa\u00e7a Deploy de novo.\"\n\
      \x20     log \"o setup N\u00c3O aplica o schema de outra vers\u00e3o no lugar: app e banco ficariam divergentes.\"\n\
      \x20     exit 1\n\
      \x20   fi\n\
      \x20   tamanho=\"$$(wc -c < \"$$BASELINE\" | tr -d ' ')\"\n\
      \x20   if [ \"$${tamanho:-0}\" -lt \"$${BASELINE_TAMANHO_MINIMO:-1000000}\" ] || ! grep -qi 'create table' \"$$BASELINE\"; then\n\
      \x20     log \"o schema baixado da vers\u00e3o $${IMAGE_TAG} n\u00e3o parece um baseline ($${tamanho:-0} bytes, sem 'create table') \u2014 recusado.\"\n\
      \x20     exit 1\n\
      \x20   fi\n\
      \x20   ;;\n\
      \x20 *)\n\
      \x20   log \"BASELINE_FONTE='$$BASELINE_FONTE' n\u00e3o existe: use 'versao' (padr\u00e3o) ou 'clone'\"\n\
      \x20   exit 1\n\
      \x20   ;;\n\
      esac\n\
      \n\
      log \"aguardando o banco\u2026\"\n\
      i=0\n\
      until pg_isready -d \"$$DB_URL\" >/dev/null 2>&1; do\n\
      \x20 i=$$((i + 1)); [ \"$$i\" -le 90 ] || { log \"banco n\u00e3o respondeu em 3 min\"; exit 1; }\n\
      \x20 sleep 2\n\
      done\n\
      \n\
      log \"aguardando o Auth\u2026\"\n\
      i=0\n\
      until wget -q -O /dev/null \"$${AUTH_URL}/health\" 2>/dev/null; do\n\
      \x20 i=$$((i + 1)); [ \"$$i\" -le 90 ] || { log \"Auth n\u00e3o respondeu em 3 min\"; exit 1; }\n\
      \x20 sleep 2\n\
      done\n\
      \n\
      log \"extens\u00f5es (vector, citext, pg_trgm)\"\n\
      q -c \"create extension if not exists vector with schema public; create extension if not exists citext with schema public; create extension if not exists pg_trgm with schema public;\"\n\
      \n\
      # Mesma r\u00e9gua do kit (hostgator-setup-kit/_common.sh), para o Dokploy tratar a\n\
      # reaplica\u00e7\u00e3o como o update.sh trata:\n\
      #  - BENIGNOS: o que a reaplica\u00e7\u00e3o PRODUZ por ser idempotente \u2014 igual a\n\
      #    BASELINE_ERROS_BENIGNOS;\n\
      #  - DISPUTA: banco ocupado ou conex\u00e3o que caiu \u2014 aplicar de novo cura (o\n\
      #    arquivo \u00e9 idempotente). Igual a BASELINE_ERROS_DE_DISPUTA;\n\
      #  - o resto \u00e9 AVISO, como no update.sh (\"o app pode ainda funcionar\"), com uma\n\
      #    exce\u00e7\u00e3o abaixo.\n\
      BENIGNOS='already exists|multiple primary keys|multiple default values|is already a member|already a partition'\n\
      DISPUTA='deadlock detected|could not serialize access|lock timeout|could not obtain lock|terminating connection|server closed the connection|connection to server was lost|SSL connection has been closed unexpectedly|SSL SYSCALL error|remaining connection slots|too many clients|max client(s| connections) reached|the database system is (starting up|shutting down|in recovery mode|not yet accepting connections)|Temporary failure in name resolution|Connection refused|Connection timed out|timeout expired|Network (is )?unreachable'\n\
      # A exce\u00e7\u00e3o \u2014 o que \u00e9 PR\u00d3PRIO desta instala\u00e7\u00e3o e reprova o setup: aqui o\n\
      # Supabase sobe junto, e o schema `storage` nasce das migrations do servi\u00e7o\n\
      # storage na partida dele. Se o baseline rodou antes, buckets e policies de\n\
      # arquivo n\u00e3o existem e o defeito s\u00f3 aparece quando algu\u00e9m anexa um arquivo \u2014\n\
      # o deploy de novo cura. E o psql que n\u00e3o chegou ao fim do arquivo. Um\n\
      # \"does not exist\" gen\u00e9rico N\u00c3O entra: o kit o tolera numa reaplica\u00e7\u00e3o, e\n\
      # reprovar por ele travaria o redeploy de quem o kit deixaria atualizar.\n\
      FATAIS='relation \"storage\\.|schema \"storage\" does not exist|storage\\.|o psql saiu com'\n\
      \n\
      tem_schema=\"$$(q -c \"select 1 from information_schema.tables where table_schema='public' and table_name='organizations' limit 1\")\"\n\
      if [ \"$$tem_schema\" = \"1\" ]; then\n\
      \x20 log \"schema existe \u2014 reaplicando o baseline em modo update (erros 'j\u00e1 existe' s\u00e3o esperados)\"\n\
      \x20 passada=1\n\
      \x20 while :; do\n\
      \x20   rc=0\n\
      \x20   psql \"$$DB_URL\" -q -f \"$$BASELINE\" >\"$$BASELINE_LOG\" 2>&1 || rc=$$?\n\
      \x20   inesperados=\"$$(grep -iE 'ERROR|FATAL' \"$$BASELINE_LOG\" | grep -viE \"$$BENIGNOS\" || true)\"\n\
      \x20   # Sem ON_ERROR_STOP o psql sai 0 mesmo com erro de SQL: sa\u00edda diferente de\n\
      \x20   # zero \u00e9 o psql que N\u00c3O chegou ao fim do arquivo.\n\
      \x20   if [ \"$$rc\" -ne 0 ]; then\n\
      \x20     inesperados=\"$$(printf '%s\\n%s' \"$$inesperados\" \"o psql saiu com c\u00f3digo $$rc: $$(tail -1 \"$$BASELINE_LOG\")\" | sed '/^$$/d')\"\n\
      \x20   fi\n\
      \x20   [ -n \"$$inesperados\" ] || break\n\
      \x20   if [ \"$$passada\" -lt 3 ] && printf '%s\\n' \"$$inesperados\" | grep -qiE \"$$DISPUTA\"; then\n\
      \x20     log \"parte do baseline perdeu uma disputa com o sistema no ar \u2014 aplicando de novo (passada $$((passada + 1)) de 3)\"\n\
      \x20     sleep $$((passada * $${BASELINE_ESPERA_S:-5}))\n\
      \x20     passada=$$((passada + 1))\n\
      \x20     continue\n\
      \x20   fi\n\
      \x20   break\n\
      \x20 done\n\
      \x20 if [ -n \"$$inesperados\" ]; then\n\
      \x20   if printf '%s\\n' \"$$inesperados\" | grep -qiE \"$$FATAIS\"; then\n\
      \x20     log \"o baseline N\u00c3O se aplicou por inteiro \u2014 o schema ficaria incompleto. Erros:\"\n\
      \x20     printf '%s\\n' \"$$inesperados\" | head -20\n\
      \x20     log \"se algum cita 'storage.', o servi\u00e7o storage ainda n\u00e3o tinha criado o schema dele: confira os Logs do storage e fa\u00e7a Deploy de novo\"\n\
      \x20     exit 1\n\
      \x20   fi\n\
      \x20   log \"AVISO: erros fora dos esperados no baseline \u2014 o CRM segue, como no update.sh do kit:\"\n\
      \x20   printf '%s\\n' \"$$inesperados\" | head -10\n\
      \x20 fi\n\
      else\n\
      \x20 log \"banco novo \u2014 aplicando o baseline (qualquer erro interrompe)\"\n\
      \x20 psql \"$$DB_URL\" -v ON_ERROR_STOP=1 -q -f \"$$BASELINE\" >\"$$BASELINE_LOG\" 2>&1 \\\n\
      \x20   || { tail -20 \"$$BASELINE_LOG\"; log \"o baseline falhou num banco NOVO; o schema ficaria incompleto\"; exit 1; }\n\
      fi\n\
      log \"tabelas em public: $$(q -c \"select count(*) from information_schema.tables where table_schema='public'\")\"\n\
      \n\
      log \"chave de cifra dos segredos\"\n\
      q -v chave=\"$$NUVEMSHOP_OAUTH_ENCRYPTION_KEY\" <<'SQL'\n\
      insert into private.app_secrets (name, value) values ('nuvemshop_oauth_key', :'chave')\n\
      on conflict (name) do update set value = excluded.value, updated_at = now();\n\
      SQL\n\
      \n\
      log \"primeiro administrador: $${OWNER_EMAIL}\"\n\
      # J\u00e1 existe? N\u00e3o recria nem troca a senha (a pessoa pode t\u00ea-la trocado pela tela).\n\
      existe=\"$$(q -v email=\"$$OWNER_EMAIL\" <<'SQL'\n\
      select 1 from auth.users where lower(email) = lower(:'email') limit 1;\n\
      SQL\n\
      )\"\n\
      if [ \"$$existe\" != \"1\" ]; then\n\
      \x20 [ -n \"$$OWNER_PASSWORD\" ] || { log \"o administrador ainda n\u00e3o existe e OWNER_PASSWORD est\u00e1 vazia \u2014 preencha no Environment e fa\u00e7a Deploy de novo\"; exit 1; }\n\
      \x20 # O JSON sai do PR\u00d3PRIO Postgres (json_build_object): aspas, barras e acentos\n\
      \x20 # na senha ou no e-mail viram JSON v\u00e1lido, sem montar texto \u00e0 m\u00e3o.\n\
      \x20 corpo=\"$$(q -v email=\"$$OWNER_EMAIL\" -v senha=\"$$OWNER_PASSWORD\" -v locale=\"$$LOCALE\" <<'SQL'\n\
      select json_build_object('email', :'email', 'password', :'senha', 'email_confirm', true,\n\
      \x20                        'user_metadata', json_build_object('locale', :'locale'));\n\
      SQL\n\
      )\"\n\
      \x20 wget -q -O /dev/null \\\n\
      \x20   --header \"apikey: $${SERVICE_ROLE_KEY}\" \\\n\
      \x20   --header \"Authorization: Bearer $${SERVICE_ROLE_KEY}\" \\\n\
      \x20   --header \"Content-Type: application/json\" \\\n\
      \x20   --post-data \"$$corpo\" \"$${AUTH_URL}/admin/users\" \\\n\
      \x20   || { log \"n\u00e3o consegui criar o usu\u00e1rio no Auth (confira SERVICE_ROLE_KEY e JWT_SECRET)\"; exit 1; }\n\
      fi\n\
      \n\
      q -v email=\"$$OWNER_EMAIL\" -v locale=\"$$LOCALE\" <<'SQL'\n\
      \\o /dev/null\n\
      select set_config('imob.email', :'email', false), set_config('imob.locale', :'locale', false);\n\
      \\o\n\
      do $$$$\n\
      declare v_org uuid; v_uid uuid;\n\
      begin\n\
      \x20 select id into v_uid from auth.users where lower(email) = lower(current_setting('imob.email'));\n\
      \x20 if v_uid is null then\n\
      \x20   raise exception 'usu\u00e1rio % n\u00e3o encontrado no auth.users', current_setting('imob.email');\n\
      \x20 end if;\n\
      \x20 select id into v_org from public.organizations where slug = 'minha-empresa';\n\
      \x20 if v_org is null then\n\
      \x20   insert into public.organizations (slug, display_name, legal_name, locale, created_by)\n\
      \x20   values ('minha-empresa', 'Minha Empresa', 'Minha Empresa', current_setting('imob.locale'), v_uid)\n\
      \x20   returning id into v_org;\n\
      \x20 end if;\n\
      \x20 insert into public.user_organizations (user_id, organization_id, role, accepted_at)\n\
      \x20 values (v_uid, v_org, 'admin', now())\n\
      \x20 on conflict (user_id, organization_id) do update set role = 'admin', revoked_at = null;\n\
      \x20 if not exists (select 1 from public.platform_admins where user_id = v_uid and revoked_at is null) then\n\
      \x20   insert into public.platform_admins (user_id, granted_by, scope, mfa_required, reason)\n\
      \x20   values (v_uid, v_uid, 'full', false, 'Bootstrap inicial do self-host (Dokploy)');\n\
      \x20 end if;\n\
      end $$$$;\n\
      SQL\n\
      \n\
      log \"pronto\"\n\
      "
